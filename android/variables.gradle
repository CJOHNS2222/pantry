// Authoritative source for Android SDK levels + androidx versions consumed via
// `rootProject.ext.*` by every Capacitor plugin under
// node_modules/@capacitor/*/android/build.gradle (their build.gradle files are
// third-party/generated — not something we can point at gradle/libs.versions.toml
// instead) AND by android/app/build.gradle's minSdk/targetSdk (F50).
//
// compileSdkVersion here must be kept numerically in sync by hand with `compileSdk` in
// gradle/libs.versions.toml — the app module reads compileSdk from the version catalog
// (the modern Gradle pattern), but TOML catalogs can't reference these Groovy `ext`
// properties, so the two can't be mechanically unified without patching third-party
// plugin build.gradle files.
ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.9.3'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.5'
    androidxBrowserVersion = '1.8.0'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '12.0.1'
    kotlin_version = '2.4.0'
}