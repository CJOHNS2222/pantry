name: CI

on:
  push:
    branches: [main]
    # Pure docs/audit-output changes never affect build/lint/test/rules output.
    paths-ignore:
      - '**/*.md'
      - 'readme/**'
      - '.claude/audits/**'
      - '.claude/dashboard/**'
      - 'graphify-out/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'readme/**'
      - '.claude/audits/**'
      - '.claude/dashboard/**'
      - 'graphify-out/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.filter.outputs.functions }}
      rules: ${{ steps.filter.outputs.rules }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            functions:
              - 'functions/**'
            rules:
              - 'firestore.rules'
              - 'storage.rules'
              - 'firestore.indexes.json'
              - 'src/test/rules/**'
              - 'vitest.rules.config.ts'

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        # Pinned (not :latest) so a new gitleaks release can't silently change
        # detection rules/behavior on an unrelated PR. Bump deliberately.
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --redact -v --exit-code 1

  app:
    name: App — lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # @capacitor-firebase/* has a peer-dep conflict with
      # @codetrix-studio/capacitor-google-auth — see CLAUDE.md.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test -- --run

      # Catches build-time-only failures (e.g. bad dynamic imports, prod-only
      # code paths) that lint/type-check/tests don't exercise, and ensures
      # `firebase deploy --only hosting` can never ship a stale/broken dist/.
      - name: Build
        run: npm run build

  functions:
    name: Functions — lint, build
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  rules:
    name: Firestore/Storage rules tests
    needs: changes
    if: needs.changes.outputs.rules == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Firestore/Storage emulators need a JRE.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install firebase-tools
        # Pinned so emulator/rules-test behavior can't shift under an unrelated PR.
        run: npm install -g firebase-tools@15.25.1

      - name: Run rules tests against the emulator
        run: firebase emulators:exec --project demo-stockandspoon-rules-test --only firestore,storage "npm run test:rules"
